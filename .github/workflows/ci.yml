name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stello
          POSTGRES_PASSWORD: stello
          POSTGRES_DB: stello
        ports:
          - 5455:5432
        options: >-
          --health-cmd "pg_isready -U stello"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stello/api prisma:generate
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
