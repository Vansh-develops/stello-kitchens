server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream api:3001;

  # Diner Scan & Order calls the public scan endpoints under /api/v1/public/scan.
  location /api/ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # PWA: the service worker and manifest must revalidate on every load so a
  # deploy reaches installed kiosks / token boards promptly.
  location = /sw.js {
    add_header Cache-Control "no-cache";
    add_header Service-Worker-Allowed "/";
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    default_type application/manifest+json;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
